name: Build Nintendo Switch Game IPA

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: |
          Ten folder game trong Google Drive games/
          Vi du: MarioOdyssey, Zelda_TOTK, Hades
        required: true
        type: string

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-ipa:
    name: Build IPA — ${{ inputs.game_name }}
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      # ── 1. nxnative source ───────────────────────────────────────────────
      - name: Checkout nxnative
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: seedds/nxnative
          persist-credentials: false

      # ── 2. Toolchain ─────────────────────────────────────────────────────
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify Metal compiler
        run: |
          xcodebuild -version
          xcrun metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install xcodegen zstd glslang unar

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # ── 3. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown backports.zstd

      # ── 3b. Free disk space (Xcode caches) ───────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Disk truoc khi don ===" && df -h / | tail -1
          rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true
          xcrun simctl delete unavailable 2>/dev/null || true
          rm -rf ~/Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          brew cleanup --prune=all 2>/dev/null || true
          rm -rf "$(brew --cache)" 2>/dev/null || true
          echo "=== Disk sau khi don ===" && df -h / | tail -1

      # ── 4. Download từ Google Drive via rclone + Service Account ────────
      - name: Download Google Drive root folder
        env:
          GDRIVE_ROOT_ID: ${{ secrets.GDRIVE_ROOT_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
        run: |
          # Cài rclone nếu chưa có
          if ! command -v rclone &>/dev/null; then
            brew install rclone
          fi

          # Tạo rclone config dùng service account
          mkdir -p "$HOME/.config/rclone"
          SA_FILE="$HOME/.config/rclone/sa.json"
          echo "$GDRIVE_SA_JSON" > "$SA_FILE"
          chmod 600 "$SA_FILE"

          printf '[gdrive]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$SA_FILE" "$GDRIVE_ROOT_ID" > "$HOME/.config/rclone/rclone.conf"

          mkdir -p "$HOME/gdrive_raw"
          # Chi download keys/ va folder game cu the (khong download toan bo Drive)
          rclone copy gdrive:keys "$HOME/gdrive_raw/keys" \
            --drive-acknowledge-abuse --transfers 4 2>&1 | tail -5
          rclone copy "gdrive:Games/$GAME_NAME" "$HOME/gdrive_raw/Games/$GAME_NAME" \
            --drive-acknowledge-abuse --transfers 4 2>&1 | tail -5

          echo "GDRIVE_BASE=$HOME/gdrive_raw" >> "$GITHUB_ENV"
          echo "=== Noi dung Drive ==="
          find "$HOME/gdrive_raw" -maxdepth 3 | sort

      # ── 4b. Download individual large files (per-game overrides) ─────────
      - name: Download per-game large files
        env:
          GAME_NAME: ${{ inputs.game_name }}
          FE3H_FILE1_ID: ${{ secrets.FE3H_FILE1_ID }}
          FE3H_FILE2_ID: ${{ secrets.FE3H_FILE2_ID }}
          FE3H_FILE3_ID: ${{ secrets.FE3H_FILE3_ID }}
          FE3H_UPDATE_ID: ${{ secrets.FE3H_UPDATE_ID }}
          FE3H_DLC_ID: ${{ secrets.FE3H_DLC_ID }}
        run: |
          GAMES_DIR=$(find "$GDRIVE_BASE" -maxdepth 1 -type d -iname "games" | head -1)
          GAME_DIR="${GAMES_DIR:-$GDRIVE_BASE/Games}/$GAME_NAME"
          mkdir -p "$GAME_DIR"

          dl() {
            local fid="$1" dest="$2"
            if [ -z "$fid" ]; then
              echo "SKIP: no ID for $dest"
              return 0
            fi
            [ -f "$dest" ] && { echo "EXISTS: $dest"; return 0; }
            echo "=== Downloading: $dest ==="
            gdown --fuzzy "$fid" -O "$dest"
            local sz
            sz=$(stat -f%z "$dest" 2>/dev/null || echo 0)
            if [ "$sz" -lt 1048576 ]; then
              echo "ERROR: $dest too small ($sz bytes), download failed"
              cat "$dest" 2>/dev/null || true
              exit 1
            fi
            echo "OK: $dest ($(du -sh "$dest" | cut -f1))"
          }

          case "$GAME_NAME" in
            "fire emblem 3 houses")
              dl "$FE3H_FILE1_ID" "$GAME_DIR/base.part1.rar"
              dl "$FE3H_FILE2_ID" "$GAME_DIR/base.part2.rar"
              dl "$FE3H_FILE3_ID" "$GAME_DIR/base.part3.rar"
              dl "$FE3H_UPDATE_ID" "$GAME_DIR/update.rar"
              dl "$FE3H_DLC_ID" "$GAME_DIR/dlc.rar"
              ;;
          esac

          echo "=== Game dir ===" && ls -lh "$GAME_DIR/" 2>/dev/null || true

      # ── 5. Lấy prod.keys ─────────────────────────────────────────────────
      - name: Setup prod.keys
        run: |
          mkdir -p "$HOME/keys"
          KEYS_FILE=$(find "$GDRIVE_BASE/keys" -name "prod.keys" 2>/dev/null | head -1)
          if [ -z "$KEYS_FILE" ]; then
            echo "ERROR: Khong tim thay prod.keys trong keys/"
            ls -la "$GDRIVE_BASE/" || true
            exit 1
          fi
          cp "$KEYS_FILE" "$HOME/keys/prod.keys"
          echo "prod.keys: $(wc -c < "$HOME/keys/prod.keys") bytes"

      # ── 6. Giải nén RAR game ─────────────────────────────────────────────
      - name: Extract game files
        env:
          GAME_NAME: ${{ inputs.game_name }}
        run: |
          # Tìm folder games/ hoặc Games/ (case insensitive)
          GAMES_DIR=$(find "$GDRIVE_BASE" -maxdepth 1 -type d -iname "games" | head -1)
          GAME_SRC="${GAMES_DIR:-$GDRIVE_BASE/games}/$GAME_NAME"
          GAME_DST="$HOME/Games/$GAME_NAME"

          if [ ! -d "$GAME_SRC" ]; then
            echo "ERROR: Khong tim thay folder '$GAME_NAME' trong games/"
            echo "Cac game co san:"
            ls "$GDRIVE_BASE/games/" 2>/dev/null || echo "(rong)"
            exit 1
          fi

          mkdir -p "$GAME_DST"

          echo "=== Noi dung folder game tren Drive ==="
          ls -lh "$GAME_SRC/"

          # Extract tất cả RARs — bỏ qua continuation parts (.part02+, .r00, .r01...)
          # -D: không tạo subfolder, extract thẳng vào GAME_DST
          ENTRY_RARS=$(find "$GAME_SRC" -maxdepth 2 -iname "*.rar" \
            | grep -viE "\.part0*[2-9][0-9]*\.rar$" \
            | grep -viE "\.r[0-9]{2}$" \
            | sort)

          if [ -n "$ENTRY_RARS" ]; then
            echo "$ENTRY_RARS" | while IFS= read -r RAR; do
              echo "=== Giai nen: $RAR ==="
              unar -force-overwrite -D "$RAR" -o "$GAME_DST/"
              rm -f "$RAR"
              echo "=== Disk sau khi xoa RAR ===" && df -h "$HOME" | tail -1
            done
          else
            # Không có RAR — copy thẳng NSP/XCI/NSZ
            echo "Khong co RAR, copy file game truc tiep..."
            find "$GAME_SRC" -maxdepth 3 \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" \) \
              -exec cp {} "$GAME_DST/" \;
          fi

          echo "=== File sau khi extract ==="
          find "$GAME_DST" -type f | sort

          # Xóa toàn bộ Drive download để giải phóng disk trước khi build
          echo "=== Giai phong disk ==="
          df -h "$HOME" | tail -1
          rm -rf "$HOME/gdrive_raw"
          df -h "$HOME" | tail -1

      # ── 7. Build IPA (ROMFS separate — IPA nho, romfs.img rieng) ─────────
      - name: Build IPA
        run: |
          # Doi ROMFS = 'bundle' thanh 'separate' de IPA nho, romfs.img rieng
          sed -i '' "s/ROMFS = 'bundle'/ROMFS = 'separate'/" scripts/build_ipa_from_nsp.py
          python3 scripts/build_ipa_from_nsp.py \
            "$HOME/Games/${{ inputs.game_name }}" \
            -k "$HOME/keys/prod.keys"

      # ── 8. Tìm và upload IPA + romfs.img ─────────────────────────────────
      - name: Find built IPA and romfs
        id: find_ipa
        run: |
          IPA=$(find "$HOME" . -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "ERROR: Khong tim thay file .ipa sau khi build!"
            exit 1
          fi
          SIZE=$(du -sh "$IPA" | cut -f1)
          echo "IPA: $IPA ($SIZE)"
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"

          # Tim romfs.img (separate build)
          ROMFS=$(find "$HOME" . -name "RomFS.img" -o -name "romfs.img" 2>/dev/null | grep -v "gdrive" | head -1)
          if [ -n "$ROMFS" ]; then
            ROMFS_SIZE=$(du -sh "$ROMFS" | cut -f1)
            echo "romfs: $ROMFS ($ROMFS_SIZE)"
            echo "romfs_path=$ROMFS" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.game_name }}-ipa-${{ github.run_number }}
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload romfs.img
        if: steps.find_ipa.outputs.romfs_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.game_name }}-romfs-${{ github.run_number }}
          path: ${{ steps.find_ipa.outputs.romfs_path }}
          retention-days: 5
          if-no-files-found: warn

      - name: Summary
        if: success()
        run: |
          echo "## Build thanh cong: ${{ inputs.game_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tai file IPA o phan **Artifacts** ben duoi." >> "$GITHUB_STEP_SUMMARY"
          echo "Dung AltStore hoac Sideloadly de cai vao iPhone." >> "$GITHUB_STEP_SUMMARY"

      # ── Upload logs khi lỗi ───────────────────────────────────────────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ inputs.game_name }}-${{ github.run_number }}
          path: |
            **/*.log
            /tmp/*.log
          retention-days: 3
          if-no-files-found: ignore
