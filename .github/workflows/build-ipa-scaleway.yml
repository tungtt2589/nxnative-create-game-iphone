name: Build IPA (Scaleway M4 Bare-Metal)

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: |
          Ten folder game trong Google Drive Games/
          Vi du: FE3H, octopath1, tactics-ogre
        required: true
        type: string

jobs:
  build-ipa:
    name: Build IPA — ${{ inputs.game_name }}
    runs-on: [self-hosted, scaleway-m4, xcode-27-baremetal]
    timeout-minutes: 240

    steps:
      # ── 1. nxnative source ───────────────────────────────────────────────
      - name: Checkout nxnative
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: seedds/nxnative
          persist-credentials: false

      # ── 2. Detect Xcode + set DEVELOPER_DIR ─────────────────────────────
      - name: Set DEVELOPER_DIR
        run: |
          # On Scaleway macOS 27, Xcode is at /Applications/Xcode.app
          # On GitHub runner, it's at /Applications/Xcode_27.2.app
          XCODE_PATH=$(xcode-select -p 2>/dev/null || true)
          if [ -z "$XCODE_PATH" ]; then
            # Try common paths
            for p in /Applications/Xcode.app /Applications/Xcode_27.app /Applications/Xcode_27.2.app; do
              if [ -d "$p" ]; then
                sudo xcode-select -s "$p/Contents/Developer"
                XCODE_PATH="$p/Contents/Developer"
                break
              fi
            done
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH" >> "$GITHUB_ENV"
          echo "Xcode path: $XCODE_PATH"
          xcodebuild -version

      # ── 3. Install Metal Toolchain ───────────────────────────────────────
      - name: Install Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # ── 4. Verify Metal + GPU ────────────────────────────────────────────
      - name: Verify Metal + GPU
        env:
          DM_ALLOW_OTHER_METAL: "1"
        run: |
          xcrun metal --version
          system_profiler SPDisplaysDataType | grep -E "Metal|Chip|GPU" || true
          python3 dm/gfx/tools/own_compilers.py --check-metal

      # ── 5. Install Homebrew packages ─────────────────────────────────────
      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install xcodegen zstd glslang unar rclone 2>&1 | tail -10 || true

      # ── 6. Python deps ───────────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip3 install lz4 "capstone>=5,<6" fonttools nsz zbic gdown backports.zstd

      # ── 7. .NET 10 ───────────────────────────────────────────────────────
      - name: Set up .NET 10
        run: |
          if ! command -v dotnet &>/dev/null; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 10.0
            echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          fi
          dotnet --version

      # ── 8. Download từ Google Drive ──────────────────────────────────────
      - name: Download Google Drive
        env:
          GDRIVE_ROOT_ID: ${{ secrets.GDRIVE_ROOT_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GAME_NAME: ${{ inputs.game_name }}
        run: |
          mkdir -p "$HOME/.config/rclone"
          SA_FILE="$HOME/.config/rclone/sa.json"
          echo "$GDRIVE_SA_JSON" > "$SA_FILE" && chmod 600 "$SA_FILE"
          printf '[gdrive]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$SA_FILE" "$GDRIVE_ROOT_ID" > "$HOME/.config/rclone/rclone.conf"

          mkdir -p "$HOME/gdrive_raw"
          rclone copy gdrive:keys "$HOME/gdrive_raw/keys" \
            --drive-acknowledge-abuse --transfers 4 2>&1 | tail -5
          rclone copy "gdrive:Games/$GAME_NAME" "$HOME/gdrive_raw/Games/$GAME_NAME" \
            --drive-acknowledge-abuse --transfers 4 2>&1 | tail -5

          echo "GDRIVE_BASE=$HOME/gdrive_raw" >> "$GITHUB_ENV"
          find "$HOME/gdrive_raw" -maxdepth 3 | sort

      # ── 9. Setup prod.keys ───────────────────────────────────────────────
      - name: Setup prod.keys
        run: |
          mkdir -p "$HOME/keys"
          KEYS_FILE=$(find "$GDRIVE_BASE/keys" -name "prod.keys" 2>/dev/null | head -1)
          [ -z "$KEYS_FILE" ] && { echo "ERROR: no prod.keys"; exit 1; }
          cp "$KEYS_FILE" "$HOME/keys/prod.keys"
          echo "prod.keys: $(wc -c < "$HOME/keys/prod.keys") bytes"

      # ── 10. Extract game files ───────────────────────────────────────────
      - name: Extract game files
        env:
          GAME_NAME: ${{ inputs.game_name }}
        run: |
          GAMES_DIR=$(find "$GDRIVE_BASE" -maxdepth 1 -type d -iname "games" | head -1)
          GAME_SRC="${GAMES_DIR:-$GDRIVE_BASE/games}/$GAME_NAME"
          GAME_DST="$HOME/Games/$GAME_NAME"

          [ ! -d "$GAME_SRC" ] && { echo "ERROR: folder '$GAME_NAME' not found"; exit 1; }
          mkdir -p "$GAME_DST"
          ls -lh "$GAME_SRC/"

          ENTRY_RARS=$(find "$GAME_SRC" -maxdepth 2 -iname "*.rar" \
            | grep -viE "\.part0*[2-9][0-9]*\.rar$" \
            | grep -viE "\.r[0-9]{2}$" | sort)

          if [ -n "$ENTRY_RARS" ]; then
            echo "$ENTRY_RARS" | while IFS= read -r RAR; do
              echo "=== Extracting: $RAR ==="
              unar -force-overwrite -D "$RAR" -o "$GAME_DST/"
              rm -f "$RAR"
              df -h "$HOME" | tail -1
            done
          else
            find "$GAME_SRC" -maxdepth 3 \( -iname "*.nsp" -o -iname "*.xci" -o -iname "*.nsz" \) \
              -exec cp {} "$GAME_DST/" \;
          fi

          find "$GAME_DST" -type f | sort
          rm -rf "$HOME/gdrive_raw"

      # ── 11. Build IPA ────────────────────────────────────────────────────
      - name: Build IPA
        env:
          DM_ALLOW_OTHER_METAL: "1"
        run: |
          sed -i '' "s/ROMFS = 'bundle'/ROMFS = 'separate'/" scripts/build_ipa_from_nsp.py
          python3 scripts/build_ipa_from_nsp.py \
            "$HOME/Games/${{ inputs.game_name }}" \
            -k "$HOME/keys/prod.keys"

      # ── 12. Upload artifacts ─────────────────────────────────────────────
      - name: Find built IPA and romfs
        id: find_ipa
        run: |
          IPA=$(find "$HOME" . -name "*.ipa" 2>/dev/null | head -1)
          [ -z "$IPA" ] && { echo "ERROR: no .ipa found"; exit 1; }
          echo "IPA: $IPA ($(du -sh "$IPA" | cut -f1))"
          echo "ipa_path=$IPA" >> "$GITHUB_OUTPUT"

          ROMFS=$(find "$HOME" . \( -name "RomFS.img" -o -name "romfs.img" \) 2>/dev/null | grep -v gdrive | head -1)
          [ -n "$ROMFS" ] && echo "romfs_path=$ROMFS" >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.game_name }}-ipa-${{ github.run_number }}
          path: ${{ steps.find_ipa.outputs.ipa_path }}
          retention-days: 5
          if-no-files-found: error

      - name: Upload romfs.img
        if: steps.find_ipa.outputs.romfs_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.game_name }}-romfs-${{ github.run_number }}
          path: ${{ steps.find_ipa.outputs.romfs_path }}
          retention-days: 5
          if-no-files-found: warn

      - name: Summary
        if: success()
        run: |
          echo "## Build thanh cong: ${{ inputs.game_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: Scaleway M4 bare-metal (Metal 4)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tai IPA + romfs o phan Artifacts ben duoi." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: logs-${{ inputs.game_name }}-${{ github.run_number }}
          path: |
            **/*.log
            /tmp/*.log
          retention-days: 3
          if-no-files-found: ignore
