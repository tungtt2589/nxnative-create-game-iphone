name: List Drive Games

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Configure rclone + list Games
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          GDRIVE_ROOT_ID: ${{ secrets.GDRIVE_ROOT_ID }}
        run: |
          if ! command -v rclone &>/dev/null; then brew install rclone; fi
          mkdir -p "$HOME/.config/rclone"
          SA_FILE="$HOME/.config/rclone/sa.json"
          echo "$GDRIVE_SA_JSON" > "$SA_FILE" && chmod 600 "$SA_FILE"
          printf '[gdrive]\ntype = drive\nscope = drive.readonly\nservice_account_file = %s\nroot_folder_id = %s\n' \
            "$SA_FILE" "$GDRIVE_ROOT_ID" > "$HOME/.config/rclone/rclone.conf"
          echo "=== Games/ folder (top-level) ==="
          rclone lsd "gdrive:Games" --drive-acknowledge-abuse
          echo "=== Files per game (max-depth 2) ==="
          rclone ls "gdrive:Games" --drive-acknowledge-abuse --max-depth 2
